<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=202610231502">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Bouquet | Fleure</title>
<meta name="description" content="Handmade bouquet, made to order. Choose colours and wrap, and order online.">
</head>
<body data-page="shop">
<main id="main" class="container">
  <div id="pdp"></div>
  <section class="section-tight" id="related-wrap">
    <h2>Related bouquets</h2>
    <div class="product-grid" id="related"></div>
  </section>
</main>
<script src="assets/js/data.js?v=202610231502"></script>
<script src="assets/js/bouquet.js?v=202610231502"></script>
<script src="assets/js/app.js?v=202610231502"></script>
<script>
  const params = new URLSearchParams(location.search);
  const p = byId(params.get("id"));
  const root = document.getElementById("pdp");

  if (!p) {
    root.innerHTML = `<div class="empty"><h1>Bouquet not found</h1><p>This bouquet may have moved.</p><a class="btn btn-primary" href="shop.html">Browse the shop</a></div>`;
    document.getElementById("related-wrap").hidden = true;
  } else {
    document.title = `${p.name} | ${SHOP.name}`;
    const drawn = Boolean(p.kind);
    const [unitOne, unit] = p.unit || (p.kind === "ribbon" ? ["rose", "roses"] : ["flower", "flowers"]);
    const labels = { colours: "Flower colours", wrap: "Wrapping paper", ribbon: "Ribbon colour" };
    const start = Object.assign({}, p.look);

    const group = (key, values) => `
      <fieldset class="option-group">
        <legend>${labels[key]}</legend>
        <div class="swatches">${values.map((v, i) => `<label class="swatch"><input type="radio" name="${key}" value="${esc(v)}"${(start[key] ? v === start[key] : i === 0) ? " checked" : ""}><span>${esc(v)}</span></label>`).join("")}</div>
      </fieldset>`;

    const contactLinks = () => emailUs();
    const pieces = p.pieces;
    const piecesBlock = pieces ? `
      <fieldset class="option-group"><legend>${esc(pieces.label)}</legend><div class="swatches">
        ${pieces.sizes.map((n, i) => `<label class="swatch"><input type="radio" name="pieces" value="${n}"${i === 0 ? " checked" : ""}><span>${n}</span></label>`).join("")}
        </div><p class="muted" style="font-size:.8rem;margin:6px 0 0">Need more? Just ${emailUs()}.</p></fieldset>` : "";
    const countBlock = p.sizes ? `
      <fieldset class="option-group"><legend>Number of ${unit}</legend><div class="swatches">
        ${p.sizes.map((n) => `<label class="swatch"><input type="radio" name="count" value="${n}"${n === start.count ? " checked" : ""}><span>${n} ${n === 1 ? unitOne : unit}</span></label>`).join("")}
        </div><p class="muted" id="mix-note" style="font-size:.8rem;margin:6px 0 0" hidden>Mixed colours start from ${p.mixMin} roses.</p><p class="muted" style="font-size:.8rem;margin:6px 0 0">Want a different number? We can make it for you, just ${contactLinks()}.</p></fieldset>` : drawn ? `
      <div class="field" style="margin-bottom:18px"><span class="field-label" id="count-label">Number of ${unit} (${p.minCount}–${p.maxCount})</span>
        <div class="qty" role="group" aria-labelledby="count-label">
          <button type="button" data-step="-1" aria-label="Fewer ${unit}">−</button>
          <input id="count" type="number" min="${p.minCount}" max="${p.maxCount}" value="${start.count}" inputmode="numeric" aria-label="Number of ${unit}">
          <button type="button" data-step="1" aria-label="More ${unit}">+</button>
        </div>
        <p class="muted" style="font-size:.8rem;margin:6px 0 0">Want more than ${p.maxCount} ${unit}? We can make it for you, just ${contactLinks()}.</p></div>` : "";

    const glitterBlock = p.kind === "ribbon" ? `
      <fieldset class="option-group"><legend>Finish</legend><div class="swatches">
        <label class="swatch"><input type="radio" name="finish" value="Without glitter"${start.glitter ? "" : " checked"}><span>Without glitter</span></label>
        <label class="swatch"><input type="radio" name="finish" value="With glitter"${start.glitter ? " checked" : ""}><span>With glitter</span></label>
      </div></fieldset>` : "";

    // Price list for every size (plain and glitter for roses), with the old price crossed out.
    const cell = (o) => {
      const now = p.priceFor(o), was = p.wasFor(o), tag = p.tagFor && p.tagFor(o);
      return now == null ? "On request" : rupees(now) + (was ? ` <s class="was">${rupees(was)}</s>` : "") + (tag ? ` <span class="offer">${esc(tag)}</span>` : "");
    };
    const glitterCols = p.kind === "ribbon";
    const unitTitle = (n) => { const u = n === 1 ? unitOne : unit; return u[0].toUpperCase() + u.slice(1); };
    const priceTable = p.sizes && p.wasFor ? `
      <div class="price-table-wrap"><h2 class="field-label">Price list</h2>
        <table class="price-table">
          <thead><tr><th scope="col">Bouquet size</th>${glitterCols ? `<th scope="col">Without glitter</th><th scope="col">With glitter</th>` : `<th scope="col">Price</th>`}</tr></thead>
          <tbody>${p.sizes.map((n) => `<tr data-count="${n}"><th scope="row">${n} ${unitTitle(n)}</th>${glitterCols ? `<td>${cell({ count: n, glitter: false })}</td><td>${cell({ count: n, glitter: true })}</td>` : `<td>${cell({ count: n })}</td>`}</tr>`).join("")}</tbody>
        </table></div>` : "";

    const photos = p.images;
    const thumbs = drawn && photos.length
      ? `<p class="field-label" style="margin:14px 0 6px">Real bouquets we've made</p><div class="thumbs">${photos.map((src, i) => `<button type="button" data-src="${src}" aria-label="Show photo ${i + 1}"><img src="${src}" alt="" loading="lazy"></button>`).join("")}</div>`
      : (!drawn && photos.length > 1 ? `<div class="thumbs">${photos.map((src, i) => `<button type="button" data-src="${src}" aria-label="Show photo ${i + 1}"${i === 0 ? ' aria-current="true"' : ""}><img src="${src}" alt="" loading="lazy"></button>`).join("")}</div>` : "");

    root.innerHTML = `
      <div class="pdp">
        <div>
          <img class="gallery-main" id="main-img" src="${drawn ? drawBouquet(p) : photos[0]}" alt="${esc(p.name)} bouquet" width="600" height="750">
          ${drawn ? `<p class="muted center" id="preview-note" style="font-size:.8rem;margin:8px 0 0">Preview of your choices. Each bouquet is handmade, so the real one will vary a little.</p>` : ""}
          ${thumbs}
          ${priceTable}
        </div>
        <div>
          <h1>${esc(p.name)}</h1>
          <p><span class="price price-lg" id="price">${priceLabel(p)}</span></p>
          <p class="muted">${esc(p.description)}</p>
          <form id="order" novalidate>
            ${p.options && p.options.colours ? group("colours", p.options.colours) : ""}
            ${countBlock}
            ${piecesBlock}
            ${glitterBlock}
            ${group("wrap", p.options.wrap)}
            <p class="note-box" style="margin:-4px 0 18px"><span>You can customise your bouquet and its colours if needed. Just ${contactLinks()}.</span></p>
            <div class="field"><label for="note">Gift note (optional)</label>
              <textarea class="input" id="note" maxlength="200" placeholder="Add your message here..."></textarea>
              <div class="counter" id="note-count" aria-live="polite">0/200</div></div>
            <div class="pdp-actions">
              <button class="btn btn-secondary" type="submit">Add to bag</button>
              <button class="btn btn-primary" type="button" id="buy-now">Order Now</button>
            </div>
          </form>
          <div class="note-box"><span style="color:var(--rose)">${ICONS.heart.replace("<svg", '<svg width="22" height="22"')}</span>
            <span>Each bouquet is lovingly handmade to order. Slight variations make your bouquet truly unique.</span></div>
        </div>
      </div>`;

    const form = document.getElementById("order");
    const count = document.getElementById("count");
    const note = document.getElementById("note");
    const mainImg = document.getElementById("main-img");

    root.querySelectorAll(".thumbs button").forEach((b) => b.addEventListener("click", () => {
      mainImg.src = b.dataset.src;
      root.querySelectorAll(".thumbs button").forEach((x) => x.removeAttribute("aria-current"));
      b.setAttribute("aria-current", "true");
      const n = document.getElementById("preview-note");
      if (n) n.textContent = "A real bouquet we've made. Change any option to see your own preview again.";
    }));
    if (count) form.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
      count.value = clampCount((parseInt(count.value, 10) || p.minCount) + Number(b.dataset.step));
      update();
    }));

    function clampCount(n) { return Math.min(p.maxCount, Math.max(p.minCount, n)); }

    function current() {
      const choice = { wrap: form.wrap.value, ribbon: start.ribbon };
      const options = { Wrap: choice.wrap };
      let name = p.name, price = p.price;
      if (drawn) {
        choice.count = p.sizes ? Number(form.count.value) : clampCount(parseInt(count.value, 10) || p.minCount);
        if (p.kind === "ribbon") {
          choice.colours = form.colours.value;
          choice.ribbon = choice.colours; // the bow always matches the roses; a mix gets two ribbons
          options.Ribbon = choice.colours;
          choice.glitter = form.finish.value === "With glitter";
          options.Colours = choice.colours;
          options.Finish = form.finish.value;
        }
        else if (form.colours) {
          choice.colours = form.colours.value;
          options.Colours = choice.colours;
        }
        name = `${p.name}, ${choice.count} ${choice.count === 1 ? unitOne : unit}`;
        price = p.priceFor(choice);
      }
      if (pieces) {
        const n = Number(form.pieces.value), [one, many] = pieces.unit;
        options[many.replace(/^./, (c) => c.toUpperCase())] = n;
        name = `${p.name}, ${n} ${n === 1 ? one : many}`;
        price = pieces.prices ? pieces.prices[n] ?? null : null;
      }
      return {
        id: p.id, name, price, qty: 1, options, note: note.value.trim(),
        image: drawn ? drawBouquet(p, choice) : (p.wrapPhotos && p.wrapPhotos[choice.wrap]) || photos[0], choice,
      };
    }

    // Mixed colours (e.g. Red & White) are not made in the smallest sizes, and sizes over 10 come only in some colours.
    function syncSizes() {
      if (!p.sizes || !form.colours) return;
      const colour = form.colours.value, mix = colour.includes(" & ");
      const min = mix && p.mixMin ? p.mixMin : 1;
      const ok = (n) => n >= min && (n <= 10 || !p.bigSizes || (p.bigSizes[colour] || []).includes(n));
      const boxes = [...form.querySelectorAll('input[name="count"]')];
      boxes.forEach((b) => { b.disabled = !ok(Number(b.value)); });
      const n = Number(form.count.value);
      if (!ok(n)) {
        const allowed = boxes.map((b) => Number(b.value)).filter(ok);
        const pick = allowed.reduce((best, x) => (Math.abs(x - n) < Math.abs(best - n) ? x : best));
        boxes.find((b) => Number(b.value) === pick).checked = true;
      }
      const missing = p.sizes.filter((x) => x > 10 && x >= min && !ok(x));
      const notes = [];
      if (mix && p.mixMin) notes.push(`Mixed colours start from ${p.mixMin} roses.`);
      if (missing.length) notes.push(`${missing.join(", ").replace(/, (\d+)$/, " and $1")} roses aren't available in ${colour.toLowerCase()} for now.`);
      const note = document.getElementById("mix-note");
      note.textContent = notes.join(" ");
      note.hidden = !notes.length;
    }

    function update(e) {
      syncSizes();
      const item = current();
      // Photo products with one photo per wrap switch to the chosen wrap.
      if (!drawn && p.wrapPhotos && e && e.target.name === "wrap") {
        mainImg.src = item.image;
        root.querySelectorAll(".thumbs button").forEach((x) => x.toggleAttribute("aria-current", x.dataset.src === item.image));
      }
      if (drawn && !(e && e.target === note)) {
        mainImg.src = item.image;
        root.querySelectorAll(".thumbs button").forEach((x) => x.removeAttribute("aria-current"));
        const n = document.getElementById("preview-note");
        if (n) n.textContent = "Preview of your choices. Each bouquet is handmade, so the real one will vary a little.";
      }
      if (pieces) document.getElementById("price").innerHTML = item.price == null ? "Price by email" : rupees(item.price);
      if (drawn) {
        const was = p.wasFor && item.price != null ? p.wasFor(item.choice) : null;
        document.getElementById("price").innerHTML = item.price == null ? "Price on request"
          : rupees(item.price) + (was ? ` <s class="was">${rupees(was)}</s>` : "");
      }
      root.querySelectorAll(".price-table tbody tr").forEach((r) => r.classList.toggle("is-current", Number(r.dataset.count) === item.choice.count));
      document.getElementById("note-count").textContent = `${note.value.length}/200`;
    }
    form.addEventListener("change", update);
    form.addEventListener("input", update);
    if (count) count.addEventListener("blur", () => { count.value = clampCount(parseInt(count.value, 10) || p.minCount); update(); });
    form.addEventListener("submit", (e) => { e.preventDefault(); addToCart(current()); });
    document.getElementById("buy-now").addEventListener("click", () => { addToCart(current(), true); location.href = "checkout.html"; });
    update();

    const related = PRODUCTS.filter((x) => x.category === p.category && x.id !== p.id).slice(0, 5);
    const fill = related.length ? related : PRODUCTS.filter((x) => x.featured && x.id !== p.id).slice(0, 5);
    document.getElementById("related").innerHTML = fill.map(productCard).join("");
  }
</script>
</body>
</html>
