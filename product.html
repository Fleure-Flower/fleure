<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Bouquet | Fleure</title>
<meta name="description" content="Handmade bouquet, made to order. Choose colours, wrap and ribbon, and order on WhatsApp.">
</head>
<body data-page="shop">
<main id="main" class="container">
  <div id="pdp"></div>
  <section class="section-tight" id="related-wrap">
    <h2>Related bouquets</h2>
    <div class="product-grid" id="related"></div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/bouquet.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const p = byId(params.get("id"));
  const root = document.getElementById("pdp");

  if (!p) {
    root.innerHTML = `<div class="empty"><h1>Bouquet not found</h1><p>This bouquet may have moved.</p><a class="btn btn-primary" href="shop.html">Browse the shop</a></div>`;
    document.getElementById("related-wrap").hidden = true;
  } else {
    document.title = `${p.name} | ${SHOP.name}`;
    const drawn = Boolean(p.kind);
    const unit = p.kind === "ribbon" ? "roses" : "flowers";
    const labels = { colours: "Flower colours", wrap: "Wrapping paper", ribbon: "Ribbon colour" };
    const start = Object.assign({}, p.look);

    const group = (key, values) => `
      <fieldset class="option-group">
        <legend>${labels[key]}</legend>
        <div class="swatches">${values.map((v, i) => `<label class="swatch"><input type="radio" name="${key}" value="${esc(v)}"${(start[key] ? v === start[key] : i === 0) ? " checked" : ""}><span>${esc(v)}</span></label>`).join("")}</div>
      </fieldset>`;

    const countBlock = drawn ? `
      <div class="field" style="margin-bottom:18px"><span class="field-label" id="count-label">Number of ${unit} (${p.minCount}–${p.maxCount})</span>
        <div class="qty" role="group" aria-labelledby="count-label">
          <button type="button" data-step="-1" aria-label="Fewer ${unit}">−</button>
          <input id="count" type="number" min="${p.minCount}" max="${p.maxCount}" value="${start.count}" inputmode="numeric" aria-label="Number of ${unit}">
          <button type="button" data-step="1" aria-label="More ${unit}">+</button>
        </div></div>` : "";

    const glitterBlock = p.kind === "ribbon" ? `
      <fieldset class="option-group"><legend>Finish</legend><div class="swatches">
        <label class="swatch"><input type="radio" name="finish" value="Without glitter"${start.glitter ? "" : " checked"}><span>Without glitter</span></label>
        <label class="swatch"><input type="radio" name="finish" value="With glitter"${start.glitter ? " checked" : ""}><span>With glitter</span></label>
      </div></fieldset>` : "";

    const photos = p.images;
    const thumbs = drawn && photos.length
      ? `<p class="field-label" style="margin:14px 0 6px">Real bouquets we've made</p><div class="thumbs">${photos.map((src, i) => `<button type="button" data-src="${src}" aria-label="Show photo ${i + 1}"><img src="${src}" alt="" loading="lazy"></button>`).join("")}</div>`
      : (!drawn && photos.length > 1 ? `<div class="thumbs">${photos.map((src, i) => `<button type="button" data-src="${src}" aria-label="Show photo ${i + 1}"${i === 0 ? ' aria-current="true"' : ""}><img src="${src}" alt="" loading="lazy"></button>`).join("")}</div>` : "");

    root.innerHTML = `
      <div class="pdp">
        <div>
          <img class="gallery-main" id="main-img" src="${drawn ? drawBouquet(p) : photos[0]}" alt="${esc(p.name)} bouquet" width="600" height="750">
          ${drawn ? `<p class="muted center" id="preview-note" style="font-size:.8rem;margin:8px 0 0">Preview of your choices. Each bouquet is handmade, so the real one will vary a little.</p>` : ""}
          ${thumbs}
        </div>
        <div>
          <h1>${esc(p.name)}</h1>
          <p><span class="price price-lg" id="price">${priceLabel(p)}</span></p>
          <p class="muted">${esc(p.description)}</p>
          <form id="order" novalidate>
            ${p.options && p.options.colours ? group("colours", p.options.colours) : ""}
            ${countBlock}
            ${glitterBlock}
            ${group("wrap", p.options.wrap)}
            ${group("ribbon", p.options.ribbon)}
            <div class="field"><label for="note">Gift note (optional)</label>
              <textarea class="input" id="note" maxlength="200" placeholder="Add your message here..."></textarea>
              <div class="counter" id="note-count" aria-live="polite">0/200</div></div>
            <div class="pdp-actions">
              <button class="btn btn-secondary" type="submit">Add to bag</button>
              <a class="btn btn-primary" id="wa-now" href="#" target="_blank" rel="noopener">${ICONS.whatsapp}Order on WhatsApp</a>
            </div>
          </form>
          <div class="note-box"><span style="color:var(--rose)">${ICONS.heart.replace("<svg", '<svg width="22" height="22"')}</span>
            <span>Each bouquet is lovingly handmade to order. Slight variations make your bouquet truly unique.</span></div>
        </div>
      </div>`;

    const form = document.getElementById("order");
    const count = document.getElementById("count");
    const note = document.getElementById("note");
    const mainImg = document.getElementById("main-img");

    root.querySelectorAll(".thumbs button").forEach((b) => b.addEventListener("click", () => {
      mainImg.src = b.dataset.src;
      root.querySelectorAll(".thumbs button").forEach((x) => x.removeAttribute("aria-current"));
      b.setAttribute("aria-current", "true");
      const n = document.getElementById("preview-note");
      if (n) n.textContent = "A real bouquet we've made. Change any option to see your own preview again.";
    }));
    if (count) form.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
      count.value = clampCount((parseInt(count.value, 10) || p.minCount) + Number(b.dataset.step));
      update();
    }));

    function clampCount(n) { return Math.min(p.maxCount, Math.max(p.minCount, n)); }

    function current() {
      const choice = { wrap: form.wrap.value, ribbon: form.ribbon.value };
      const options = { Wrap: choice.wrap, Ribbon: choice.ribbon };
      let name = p.name, price = p.price;
      if (drawn) {
        choice.count = clampCount(parseInt(count.value, 10) || p.minCount);
        if (p.kind === "ribbon") {
          choice.colours = form.colours.value;
          choice.glitter = form.finish.value === "With glitter";
          options.Colours = choice.colours;
          options.Finish = form.finish.value;
        }
        name = `${p.name}, ${choice.count} ${choice.count === 1 ? unit.slice(0, -1) : unit}`;
        price = p.priceFor(choice);
      }
      return {
        id: p.id, name, price, qty: 1, options, note: note.value.trim(),
        image: drawn ? drawBouquet(p, choice) : photos[0], choice,
      };
    }

    function update(e) {
      const item = current();
      if (drawn && !(e && e.target === note)) {
        mainImg.src = item.image;
        root.querySelectorAll(".thumbs button").forEach((x) => x.removeAttribute("aria-current"));
        const n = document.getElementById("preview-note");
        if (n) n.textContent = "Preview of your choices. Each bouquet is handmade, so the real one will vary a little.";
      }
      if (drawn) document.getElementById("price").textContent = item.price == null ? "Price on WhatsApp" : rupees(item.price);
      document.getElementById("note-count").textContent = `${note.value.length}/200`;
      document.getElementById("wa-now").href = waLink(orderMessage([item]));
    }
    form.addEventListener("change", update);
    form.addEventListener("input", update);
    if (count) count.addEventListener("blur", () => { count.value = clampCount(parseInt(count.value, 10) || p.minCount); update(); });
    form.addEventListener("submit", (e) => { e.preventDefault(); addToCart(current()); });
    update();

    const related = PRODUCTS.filter((x) => x.category === p.category && x.id !== p.id).slice(0, 5);
    const fill = related.length ? related : PRODUCTS.filter((x) => x.featured && x.id !== p.id).slice(0, 5);
    document.getElementById("related").innerHTML = fill.map(productCard).join("");
  }
</script>
</body>
</html>
