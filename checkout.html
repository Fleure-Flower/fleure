<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=202610242001">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Checkout | Fleure</title>
<meta name="description" content="Place your order: your details, pickup or delivery, and online payment.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF4F1">
<link rel="canonical" href="https://fleure-flower.github.io/fleure/checkout.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fleure">
<meta property="og:title" content="Checkout | Fleure">
<meta property="og:description" content="Place your order: your details, pickup or delivery, and online payment.">
<meta property="og:url" content="https://fleure-flower.github.io/fleure/checkout.html">
<meta property="og:image" content="https://fleure-flower.github.io/fleure/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="checkout">
<main id="main" class="container">
  <section class="section-tight split" style="align-items:start" id="checkout">
    <form class="panel" id="order" novalidate style="padding:24px">
      <h1 class="script" style="font-size:2.4rem;margin:0 0 12px">Checkout</h1>
      <p class="muted" id="step-label" style="margin:0 0 14px">Step 1 of 2: Your details</p>
      <div id="step1">
      <div class="form-grid">
        <div class="field full"><label for="o-name">Full Name</label><input class="input" id="o-name" name="name" autocomplete="name" required><div class="error" id="e-name"></div></div>
        <div class="field"><label for="o-email">Email</label><input class="input" id="o-email" name="email" type="email" autocomplete="email" required><div class="error" id="e-email"></div></div>
        <div class="field"><label for="o-phone">Phone Number</label><input class="input" id="o-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required><div class="error" id="e-phone"></div></div>
      </div>
      <fieldset class="option-group">
        <legend>Pickup or delivery</legend>
        <div class="swatches" id="methods"></div>
      </fieldset>
      <div class="form-grid">
        <div class="field full" id="address-field"><label for="o-address">Delivery Address</label><p class="muted" id="area-note" style="font-size:.8rem;margin:0 0 6px"></p><textarea class="input" id="o-address" name="address" autocomplete="street-address"></textarea><div class="error" id="e-address"></div>
</div>
        <div class="field" id="pincode-field"><label for="o-pincode">Pincode</label><input class="input" id="o-pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6"><div class="error" id="e-pincode" role="status"></div></div>
        <div class="field"><label for="o-date">Date needed</label><input class="input" id="o-date" name="date" type="date" required><div class="error" id="e-date"></div></div>
        <div class="field full"><label for="o-notes">Customisation ideas and extra requests (optional)</label><textarea class="input" id="o-notes" name="notes" maxlength="500" placeholder="Colours, design, a message for the card, or anything else you'd like."></textarea></div>
      </div>
      <p class="note-box" style="margin:4px 0 18px"><span><strong>Online payment only. No cash on delivery.</strong> On the next step you'll pay by scanning our QR code and upload a screenshot of your payment.</span></p>
      <button class="btn btn-primary btn-block" type="button" id="next">Continue to Payment</button>
      </div>
      <div id="step2" hidden>
        <p style="margin:0 0 6px">Amount to pay: <strong id="pay-amount"></strong></p>
        <p class="muted" id="pay-unpriced" style="font-size:.85rem;margin:0 0 10px" hidden></p>
        <div id="qr" class="center" style="margin:0 0 16px"></div>
        <div class="field"><label for="o-shot">Screenshot of your payment</label><input class="input" id="o-shot" name="shot" type="file" accept="image/*"><div class="error" id="e-shot"></div>
          <img id="shot-preview" alt="Your payment screenshot" hidden style="max-width:180px;margin-top:10px;border-radius:8px"></div>
        <button class="btn btn-primary btn-block" type="submit" id="place">Place Order</button>
        <button class="btn btn-secondary btn-block" type="button" id="back" style="margin-top:10px">Back to details</button>
      </div>
      <p class="error" id="send-error" role="alert" style="margin-top:10px"></p>
    </form>
    <aside class="panel" style="padding:24px">
      <h2 style="margin-top:0">Your order</h2>
      <div id="summary"></div>
    </aside>
  </section>
  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title" style="margin-top:0">Are you sure you want to order this?</h2>
    <div id="confirm-summary"></div>
    <p class="error" id="confirm-error" role="alert"></p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" type="button" id="confirm-no">Go back</button>
      <button class="btn btn-primary" type="button" id="confirm-yes">Confirm Order</button>
    </div>
  </dialog>
</main>
<script src="assets/js/data.js?v=202610242001"></script>
<script src="assets/js/bouquet.js?v=202610242001"></script>
<script src="assets/js/app.js?v=202610242001"></script>
<script>
  const D = SHOP.delivery;
  const METHODS = [["Pickup", D.pickup, "Pickup (free)"], ["Day delivery", D.day, `Day delivery (₹${D.day})`], ["Night delivery", D.night, `Night delivery (₹${D.night})`]];
  const form = document.getElementById("order");
  const items = getCart();
  document.getElementById("area-note").textContent = `We deliver only in ${D.area}.`;


  if (!items.length) {
    document.getElementById("checkout").innerHTML = `<div class="empty panel" style="padding:32px;grid-column:1/-1"><p>Your bag is empty.</p><a class="btn btn-secondary" href="shop.html">Browse bouquets</a></div>`;
  } else {
    document.getElementById("methods").innerHTML = METHODS.map(([v, , label], i) =>
      `<label class="swatch"><input type="radio" name="method" value="${v}"${i === 1 ? " checked" : ""}><span>${label}</span></label>`).join("");
    const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    form.date.min = today.toISOString().slice(0, 10);

    const subtotal = items.reduce((s, it) => s + lineTotal(it), 0);
    const unpriced = items.some((it) => !it.price);
    const charge = () => METHODS.find(([v]) => v === form.method.value)[1];
    const summary = () => {
      const isPickup = form.method.value === "Pickup";
      document.getElementById("address-field").hidden = isPickup;
      document.getElementById("pincode-field").hidden = isPickup;
      document.getElementById("summary").innerHTML = items.map((it) => `
        <div class="cart-item"><img src="${esc(it.image)}" alt="">
          <div><strong>${esc(it.name)}</strong>
            <div class="meta">${Object.entries(it.options || {}).filter(([, v]) => v).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ")}</div>
            <div class="meta">Qty ${it.qty} · ${it.price ? rupees(lineTotal(it)) : "Price on request"}</div></div></div>`).join("") + `
        <div class="cart-total"><span>Bouquets</span><span>${rupees(subtotal)}${unpriced ? " +" : ""}</span></div>
        <div class="cart-total"><span>${esc(form.method.value)}</span><span>${charge() ? rupees(charge()) : "Free"}</span></div>
        <div class="cart-total" style="font-size:1.15rem"><strong>Total</strong><strong>${rupees(subtotal + charge())}${unpriced ? " +" : ""}</strong></div>
        ${unpriced ? `<p class="muted" style="font-size:.8rem">Some bouquets are priced on request. We'll email you the final total.</p>` : ""}`;
    };
    form.addEventListener("change", summary);
    form.addEventListener("input", (e) => {
      const err = document.getElementById("e-" + e.target.name);
      if (err) { err.textContent = ""; e.target.removeAttribute("aria-invalid"); }
      // Tell customers straight away when we can't deliver to their pincode.
      const pin = e.target.value.trim();
      if (e.target.name === "pincode" && pin.length === 6) {
        const ok = D.pincodes.includes(pin);
        err.textContent = ok ? `Great, we deliver to ${pin}.` : `Sorry, delivery isn't available at ${pin}. We deliver only in ${D.area}. Please choose pickup instead.`;
        err.style.color = ok ? "var(--wine)" : "";
      }
    });
    summary();

    const step1 = document.getElementById("step1"), step2 = document.getElementById("step2");
    const showStep = (two) => {
      step1.hidden = two; step2.hidden = !two;
      document.getElementById("step-label").textContent = two ? "Step 2 of 2: Payment" : "Step 1 of 2: Your details";
      document.getElementById("send-error").textContent = "";
      scrollTo(0, 0);
    };
    const checkDetails = () => {
      const isPickup = form.method.value === "Pickup";
      const checks = [
        ["name", "Please enter your name.", (v) => v],
        ["email", "Please enter a valid email.", (v) => /^\S+@\S+\.\S+$/.test(v)],
        ["phone", "Please enter a valid phone number.", (v) => v.replace(/\D/g, "").length >= 10],
        ["address", "Please add your delivery address.", (v) => isPickup || v],
        ["pincode", `Sorry, delivery isn't available at this pincode. We deliver only in ${D.area}. Please choose pickup instead.`, (v) => isPickup || D.pincodes.includes(v)],
        ["date", "Please choose a date.", (v) => v],
      ];
      let ok = true;
      for (const [field, msg, test] of checks) {
        const el = form[field], bad = !test(el.value.trim());
        el.setAttribute("aria-invalid", String(bad));
        document.getElementById("e-" + field).textContent = bad ? msg : "";
        if (bad && ok) { el.focus(); ok = false; }
      }
      return ok;
    };
    const goToPayment = () => {
      if (!checkDetails()) return;
      document.getElementById("pay-amount").textContent = rupees(subtotal + charge()) + (unpriced ? " + bouquets priced on request" : "");
      const up = document.getElementById("pay-unpriced");
      up.hidden = !unpriced;
      up.textContent = "Some bouquets are priced on request, so we'll email you the final amount. If you haven't paid yet, you can still place the order and email us the screenshot later.";
      document.getElementById("qr").innerHTML = SHOP.paymentQr
        ? `<img src="${esc(SHOP.paymentQr)}" alt="Payment QR code" style="max-width:240px;width:100%;border-radius:12px;margin:0 auto"><p class="muted" style="font-size:.85rem">Scan with any UPI app, pay the amount above, then upload a screenshot below.</p>`
        : `<p class="note-box"><span>Our payment QR code is coming soon. For now, place your order and we'll email you how to pay. You can send us the payment screenshot by email.</span></p>`;
      showStep(true);
    };
    // Until the payment QR is ready, orders are placed in one step and the team contacts the customer about payment.
    const noQr = !SHOP.paymentQr;
    if (noQr) {
      document.getElementById("step-label").hidden = true;
      document.getElementById("next").textContent = "Place Order";
      form.querySelector("#step1 .note-box span").innerHTML = "<strong>Online payment only. No cash on delivery.</strong> After you confirm, our team will reach you to share how to pay.";
    }
    const proceed = () => (noQr ? checkDetails() && openConfirm() : goToPayment());
    document.getElementById("next").addEventListener("click", proceed);
    document.getElementById("back").addEventListener("click", () => showStep(false));

    // Shrinks the payment screenshot so it uploads quickly.
    let shot = "";
    form.shot.addEventListener("change", () => {
      const file = form.shot.files[0], prev = document.getElementById("shot-preview");
      shot = ""; prev.hidden = true;
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        shot = c.toDataURL("image/jpeg", 0.8);
        prev.src = shot; prev.hidden = false;
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => { document.getElementById("e-shot").textContent = "Please choose a picture (a screenshot of your payment)."; };
      img.src = URL.createObjectURL(file);
    });

    const dialog = document.getElementById("confirm");
    const openConfirm = () => {
      const pickup = form.method.value === "Pickup";
      document.getElementById("confirm-summary").innerHTML = `
        <ul style="margin:0 0 12px;padding-left:18px">${items.map((it) => `<li>${esc(it.name)} × ${it.qty}</li>`).join("")}</ul>
        <p style="margin:0 0 4px">${esc(form.method.value)}${pickup ? "" : ` to ${esc(form.address.value.trim())}, ${esc(D.area)} ${esc(form.pincode.value.trim())}`}, on ${esc(form.date.value)}</p>
        <p style="margin:0"><strong>Total: ${rupees(subtotal + charge())}${unpriced ? " + bouquets priced on request" : ""}</strong></p>`;
      document.getElementById("confirm-error").textContent = "";
      dialog.showModal();
    };
    document.getElementById("confirm-no").addEventListener("click", () => dialog.close());

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (step2.hidden) return proceed();
      if (!checkDetails()) return showStep(false);
      const shotErr = document.getElementById("e-shot");
      if (!shot && !unpriced) {
        shotErr.textContent = "Please upload a screenshot of your payment.";
        form.shot.focus();
        return;
      }
      shotErr.textContent = "";
      openConfirm();
    });

    document.getElementById("confirm-yes").addEventListener("click", async () => {
      const isPickup = form.method.value === "Pickup";
      const f = Object.fromEntries([...new FormData(form)].filter(([k]) => k !== "shot"));
      const record = {
        type: "Order", orderId: newOrderId(), name: f.name.trim(), email: f.email.trim(), phone: f.phone.trim(),
        items: itemsText(items), subtotal, method: f.method, deliveryCharge: charge(), total: subtotal + charge(),
        address: isPickup ? "" : `${f.address.trim()}, ${D.area} ${f.pincode.trim()}`, date: f.date, notes: f.notes.trim(),
        screenshot: shot,
      };
      const btn = document.getElementById("confirm-yes"), err = document.getElementById("confirm-error");
      btn.disabled = true; btn.textContent = "Placing order..."; err.textContent = "";
      try {
        await sendToShop(record);
      } catch (x) {
        btn.disabled = false; btn.textContent = "Confirm Order";
        err.innerHTML = x.message === "not-set-up"
          ? `Online orders are opening soon. For now, please ${emailUs("email us your order")}.`
          : `Sorry, your order didn't go through. Please try again, or ${emailUs("email us")}.`;
        return;
      }
      dialog.close();
      clearCart();
      saveCustomer({ email: record.email, phone: record.phone });
      document.getElementById("checkout").innerHTML = `
        <div class="panel center" style="padding:32px;grid-column:1/-1">
          <h1 class="script" style="font-size:2.6rem;margin:0">Thank you, ${esc(record.name)}!</h1>
          <p><strong>Your order has been confirmed. Our team will reach you shortly.</strong></p>
          <p>Your order number is <strong>${esc(record.orderId)}</strong>.</p>
          <p class="muted">We'll contact you at ${esc(record.email)} or ${esc(record.phone)}. Online payment only, no cash on delivery.</p>
          <a class="btn btn-primary" href="orders.html">View my orders</a>
          <a class="btn btn-secondary" href="shop.html">Keep browsing</a>
        </div>`;
      scrollTo(0, 0);
    });
  }
</script>
</body>
</html>
