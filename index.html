<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=202610241740">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Fleure | Handmade Flower Bouquets</title>
<meta name="description" content="Handmade forever flowers that never wilt: pipe-cleaner and satin ribbon bouquets, made to order. Order online.">
<meta name="theme-color" content="#FBF4F1">
<link rel="canonical" href="https://sahil-sinha-11.github.io/flower-website/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fleure">
<meta property="og:title" content="Fleure | Handmade Flower Bouquets">
<meta property="og:description" content="Handmade forever flowers that never wilt: pipe-cleaner and satin ribbon bouquets, made to order. Order online.">
<meta property="og:url" content="https://sahil-sinha-11.github.io/flower-website/">
<meta property="og:image" content="https://sahil-sinha-11.github.io/flower-website/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="home">
<main id="main">
  <section class="hero">
    <div class="container">
      <div class="hero-card panel">
        <div>
          <h1 class="hero-brand" data-shop-name>Fleure</h1>
          <p class="hero-sub">Handmade Flowers</p>
          <p class="hero-tagline">Handmade forever flowers that never wilt</p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="shop.html">Shop Now</a>
            <a class="btn btn-secondary" href="custom.html">Custom Order</a>
          </div>
        </div>
        <div class="hero-images">
          <img src="assets/photos/rose-red_white-wrap.jpg" alt="Red satin ribbon roses in white wrap" width="300" height="400">
          <img src="assets/photos/lily-red-white_white-wrap.jpg" alt="Red and white pipe-cleaner lily bouquet" width="300" height="400">
          <img src="assets/sizes/pink/white-plain-3.jpg" alt="Pink satin ribbon roses in white wrap" width="300" height="400">
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <h2 class="section-title">Shop by type</h2>
      <div class="divider">♥</div>
      <div class="cat-grid" id="categories"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <h2 class="section-title">Why choose us</h2>
      <div class="divider">♥</div>
      <div class="features" id="why"></div>
    </div>
  </section>

  <section class="section-tight" id="reviews" hidden>
    <div class="container">
      <h2 class="section-title">What our customers say</h2>
      <div class="divider">♥</div>
      <div class="features" id="review-list"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="thanks"><span class="script">Thank you</span>for supporting handmade</div>
    </div>
  </section>
</main>
<script src="assets/js/data.js?v=202610241740"></script>
<script src="assets/js/bouquet.js?v=202610241740"></script>
<script src="assets/js/app.js?v=202610241740"></script>
<script>
  document.querySelectorAll("[data-shop-name]").forEach((el) => (el.textContent = SHOP.name));


  const catImage = { ribbon: "red-ribbon-roses", lily: "white-lily-bouquet", gift: "photo-teddy-bouquet" };
  document.getElementById("categories").innerHTML = CATEGORIES.map((c) => `
    <a class="cat-tile" href="shop.html#${c.id}">
      <img src="${productImage(byId(catImage[c.id]))}" alt="" loading="lazy" width="300" height="375">
      <div class="cat-label"><h3>${esc(c.short)}</h3><span class="price">${esc(c.priceLabel)}</span></div>
    </a>`).join("");

  document.getElementById("why").innerHTML = [
    ["heart", "Handmade with love"], ["ribbon", "Premium materials"], ["sparkle", "Cute & affordable"], ["gift", "Perfect for gifting"],
  ].map(([icon, text]) => `<div class="feature panel"><span class="feature-icon">${ICONS[icon]}</span><strong>${text}</strong></div>`).join("");

  if (REVIEWS.length) {
    document.getElementById("reviews").hidden = false;
    document.getElementById("review-list").innerHTML = REVIEWS.map((r) => `<blockquote class="panel" style="margin:0;padding:18px"><p>“${esc(r.text)}”</p><cite class="muted">— ${esc(r.name)}</cite></blockquote>`).join("");
  }
</script>
</body>
</html>
